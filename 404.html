  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue: #12A8FF;
      --blue-dark: #077DDB;
      --bg: #031225;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Grid */
    body::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(18,168,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18,168,255,.05) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* Orb */
    .orb {
      position: absolute;
      border-radius: 50%;
      width: 500px; height: 500px;
      background: var(--blue);
      filter: blur(140px);
      opacity: .08;
      top: -150px; left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .inner {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }

    .logo-row {
      display: flex; align-items: center; gap: 12px;
      justify-content: center;
      margin-bottom: 60px;
    }
    .logo-name {
      font-size: 20px; font-weight: 800; letter-spacing: -.3px;
    }
    .logo-name em { font-style: normal; color: var(--blue); }

    .code-404 {
      font-size: clamp(90px, 18vw, 140px);
      font-weight: 900;
      letter-spacing: -4px;
      line-height: 1;
      background: linear-gradient(135deg, var(--blue), #5dd0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: -.5px;
    }

    p {
      font-size: 15px;
      color: rgba(255,255,255,.5);
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .btn-group {
      display: flex; gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity .2s, transform .2s;
      cursor: pointer;
      border: none;
    }
    .btn:hover { opacity: .85; transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      color: #fff;
    }
    .btn-secondary {
      background: rgba(18,168,255,.1);
      border: 1.5px solid rgba(18,168,255,.3);
      color: rgba(255,255,255,.8);
    }
  </style>
</head>
